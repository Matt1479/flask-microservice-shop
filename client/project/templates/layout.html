<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap: CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="/static/styles.css" rel="stylesheet">

    <title>{% block title %}{% endblock %}</title>
</head>

<body>
    <div class="d-flex min-vh-100">

        <!-- Sidebar -->
        <aside class="border-end">
            <div class="flex-shrink-0 p-3" style="width: 280px;">

                <a href="{{ url_for('index') }}"
                    class="d-flex align-items-center pb-3 mb-3 link-body-emphasis text-decoration-none border-bottom">
                    <svg class="bi pe-none me-2" width="30" height="24" aria-hidden="true">
                        <use xlink:href="#bootstrap"></use>
                    </svg>
                    <span class="fs-5 fw-semibold">Shop</span>
                </a>

                <ul class="list-unstyled ps-0">

                    <li class="mb-1">

                        <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed"
                            data-bs-toggle="collapse" data-bs-target="#products-collapse" aria-expanded="false">
                            Products
                        </button>

                        <div class="collapse" id="products-collapse">

                            <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                                <li>
                                    <a href="{{ url_for('add_product') }}" class="link-body-emphasis d-inline-flex text-decoration-none rounded">
                                        Add
                                    </a>
                                </li>
                                <li>
                                    <a href="{{ url_for('get_products') }}" class="link-body-emphasis d-inline-flex text-decoration-none rounded">
                                        View
                                    </a>
                                </li>
                            </ul>

                        </div>

                    </li>

                    <li class="border-top my-3"></li>

                    <li class="mb-1">

                        <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed"
                            data-bs-toggle="collapse" data-bs-target="#auth-collapse" aria-expanded="false">
                            Auth
                        </button>

                        <div class="collapse" id="auth-collapse">

                            <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                                <li>
                                    <a href="{{ url_for('login') }}" class="link-body-emphasis d-inline-flex text-decoration-none rounded">
                                        Login
                                    </a>
                                </li>
                                <li>
                                    <a href="{{ url_for('logout') }}" class="link-body-emphasis d-inline-flex text-decoration-none rounded">
                                        Logout
                                    </a>
                                </li>
                            </ul>

                        </div>

                    </li>

                </ul>

            </div>
        </aside>

        <div class="d-flex flex-column flex-fill">

            {% if get_flashed_messages() %}
                <header>
                    <div class="alert alert-primary m-1 mb-0 text-center" role="alert">
                        {{ get_flashed_messages() | join(" ") }}
                    </div>
                </header>
            {% endif %}

            <main class="flex-fill">
                <div class="container px-4 py-4">
                    {% block main %}{% endblock %}
                </div>
            </main>

        </div>

    </div>

    <!-- Bootstrap: JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
