{% extends "layout.html" %}

{% block title %}
    Add a new product
{% endblock %}

{% block main %}

    <div class="form-signin w-100 m-auto p-1">
        <h1 class="h3 mb-3 fw-normal">Add a new product</h1>

        <form action="{{ url_for('add_product') }}" method="post">

            <div class="form-floating mb-1">
                <input class="form-control" id="floatingTitle" name="title"
                    placeholder="Title" type="text">
                <label for="floatingTitle">Title</label>
            </div>

            <div class="form-floating mb-1">
                <input class="form-control" id="floatingDescription" name="description"
                    placeholder="Description" type="text">
                <label for="floatingDescription">Description</label>
            </div>

            <div class="form-floating mb-1">
                <input class="form-control" id="floatingCategory" name="category"
                    placeholder="Category" type="text">
                <label for="floatingCategory">Category</label>
            </div>

            <div class="form-floating mb-1">
                <input class="form-control" id="floatingPrice" name="price"
                    placeholder="price" type="number" step="0.01">
                <label for="floatingPrice">Price</label>
            </div>
            
            <div class="form-floating mb-1">
                <input class="form-control" id="floatingStock" name="stock"
                    placeholder="Stock" type="number">
                <label for="floatingStock">Stock</label>
            </div>
    
            <button class="btn btn-primary w-100 py-2" type="submit">Submit</button>
    
        </form>
    </div>

{% endblock %}
