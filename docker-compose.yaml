services:
  client:
    build: ./client
    environment:
      - BASE_API_URL=http://gateway:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - internal

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth
      - shop
      - logs
    environment:
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - internal
  
  auth:
    build: ./auth
    environment:
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - internal
  
  shop:
    build: ./shop
    networks:
      - internal
  
  logs:
    build: ./logs
    networks:
      - internal

networks:
  internal:
    driver: bridge
